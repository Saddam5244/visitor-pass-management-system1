name: Visitor Pass Management System CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Seed Database
        working-directory: ./backend
        env:
          MONGO_URI: mongodb://localhost:27017/visitor_pass_db
          JWT_SECRET: test_github_actions_jwt_secret_key_2026
        run: npm run seed

      - name: Start Backend Server
        working-directory: ./backend
        env:
          PORT: 5000
          NODE_ENV: production
          MONGO_URI: mongodb://localhost:27017/visitor_pass_db
          JWT_SECRET: test_github_actions_jwt_secret_key_2026
        run: |
          node server.js &
          sleep 5

      - name: Run E2E Automated Verification Test Suite
        working-directory: ./backend
        run: node verifyE2E.js
